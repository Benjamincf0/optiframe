[project]
name = "optiframe"
version = "0.1.0"
description = "OptiFrame backend: lens measurement, parametric frame STL generation and orders"
readme = "README.md"
authors = [
    { name = "Benjamin Curis-Friedman", email = "bencf99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "fonttools>=4.66.1",
    "manifold3d>=3.5.4",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pwdlib[argon2]>=0.3.1",
    "pyclipper>=1.4.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "sqlalchemy>=2.1.3",
    "trimesh>=5.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
optiframe = "optiframe:main"
optiframe-fetch-model = "optiframe:fetch_model"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI dependency defaults
    "E501",  # long user-facing message strings are clearer unwrapped
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette suggests httpx2 for its test client; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
